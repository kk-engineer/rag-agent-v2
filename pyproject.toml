[project]
name = "rag_engine"
version = "0.1.0"
description = "A modular, plug-and-play, enterprise-grade RAG library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.34.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "pypdf>=4.1.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.6",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ragas>=0.1.0",
    "opensmith",
    "sentence-transformers>=2.2.2",
    "torchvision",
    "transformers>=4.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["rag_engine"]
