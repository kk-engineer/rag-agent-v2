# ==========================================
# RAG Engine Hyperparameters Configuration
# ==========================================

[memory]
# context_window: Maximum number of recent conversation turns (user+assistant) to retain
# and inject as context for the next LLM generation. Set to 0 to disable conversational memory.
context_window = 5

[chunking]
# max_chunk_size: Maximum character count allowed for a single semantic text chunk.
# Acceptable values: positive integers (typically 500 to 3000). Larger values capture
# broader context but might dilute specific facts.
max_chunk_size = 1500

# k: Standard deviation threshold multiplier for semantic chunk boundary detection.
# Acceptable values: positive floats (typically 0.5 to 2.0).
# A boundary is created when the distance between adjacent sentences exceeds:
#   mean_distance + k * std_distance
# Lower values make boundary detection more sensitive (creating smaller, more numerous chunks).
# Higher values make it less sensitive (creating larger, fewer chunks).
k = 1.0

[retrieval]
# top_n: Number of final document nodes to return after all retrieval and reranking steps.
# Acceptable values: positive integers (typically 3 to 10).
# Increasing top_n provides more context to the LLM but increases API tokens and latency.
top_n = 5

# use_hyde: Enables/disables Hypothetical Document Embeddings (HyDE) expansion.
# Acceptable values: boolean (true or false).
# When true, the engine first generates a mock response to the query using the LLM
# and embeds that mock response to search the vector space, matching conceptual topics.
# When false, it embeds the query directly.
use_hyde = false

# rrf_k: Penalty constant used in Reciprocal Rank Fusion (RRF).
# Acceptable values: positive integers (typically 40 to 100, default is 60).
# RRF score = sum(weight / (rrf_k + rank)).
# Higher values smooth out the rank differences between BM25 and Vector models,
# making top-ranked elements slightly less dominant relative to mid-ranked ones.
rrf_k = 60

# rrf_weight_sparse: Weight multiplier applied to the BM25 (sparse) rank score in RRF.
# Acceptable values: floats between 0.0 and 5.0 (default is 1.0).
# Setting this higher prioritizes keyword matches over semantic matches.
rrf_weight_sparse = 1.0

# rrf_weight_dense: Weight multiplier applied to the Vector (dense) rank score in RRF.
# Acceptable values: floats between 0.0 and 5.0 (default is 1.0).
# Setting this higher prioritizes semantic/vector matches over keyword matches.
rrf_weight_dense = 1.0

# embedding_batch_tokens: Maximum token count per single embedding request (both for the local
# API server and the direct HF model). Texts exceeding this limit are automatically split into
# chunks, embedded separately, and the resulting vectors are averaged.
# Acceptable values: positive integers. Should match the server's `--batch-size` / `-b` flag
# (default in llama.cpp is 512). Increase if your server is started with a larger batch size.
embedding_batch_tokens = 512

[generation]
# temperature: Sampling temperature for final answer generation.
# Acceptable values: floats between 0.0 and 1.0 (typically 0.0 for deterministic factual QA).
temperature = 0.0

# max_tokens: Maximum number of tokens generated for the final answer.
# Acceptable values: positive integers (typically 128 to 1024), or null for default.
max_tokens = 512

[guardrails]
# max_attempts: Maximum number of iterative fix loops allowed for self-correction.
# Acceptable values: positive integers (typically 1 to 5).
# If the generated answer fails faithfulness or citation checks, the engine rewrites it
# with self-correction prompts up to this many attempts.
max_attempts = 3

[models]
# embedder_repo_id: Hugging Face repository ID for local fallback embedding model.
# Acceptable values: Any valid HF model string.
embedder_repo_id = "sentence-transformers/all-MiniLM-L6-v2"

# embedder_local_dir: Local path where the embedding model is cached.
# Acceptable values: valid directory path.
embedder_local_dir = "local_models/all-MiniLM-L6-v2"

# reranker_repo_id: Hugging Face repository ID for local fallback reranking cross-encoder model.
# Acceptable values: Any valid HF model string.
reranker_repo_id = "cross-encoder/ms-marco-MiniLM-L-6-v2"

# reranker_local_dir: Local path where the reranking model is cached.
# Acceptable values: valid directory path.
reranker_local_dir = "local_models/ms-marco-MiniLM-L-6-v2"
